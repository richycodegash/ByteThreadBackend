<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posts feed tester</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1c2430;
    --muted: #667085;
    --line: #dde1e8;
    --accent: #0f6e8c;
    --accent-dark: #0b566e;
    --error-bg: #fdecec;
    --error-text: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1116;
      --surface: #1b222b;
      --text: #e6eaf0;
      --muted: #98a2b3;
      --line: #2c3541;
      --accent: #3aa6c6;
      --accent-dark: #5bbad7;
      --error-bg: #3a1d1d;
      --error-text: #f4b4b4;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
  }

  /* ---------- top bar ---------- */
  header {
    flex: 0 0 auto;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
  }
  form, .auth { display: flex; gap: 8px; max-width: 900px; margin: 0 auto; }
  .auth { margin-top: 8px; flex-wrap: wrap; }
  .auth input { min-width: 150px; }
  .auth select { flex: 0 0 auto; }
  input, select {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  button.load {
    font: inherit;
    padding: 9px 18px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button.load:hover { background: var(--accent-dark); }

  #error {
    flex: 0 0 auto;
    margin: 10px 16px 0;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--error-bg);
    color: var(--error-text);
    white-space: pre-wrap;
  }

  /* ---------- feed layout ---------- */
  main {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 14px;
    padding: 12px;
  }
  .phone {
    flex: 0 1 420px;
    min-width: 0;
    border-radius: 16px;
    overflow: hidden;
    background: #0d1117;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  #feed {
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .slide {
    position: relative;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    color: #fff;
  }
  .media { position: absolute; inset: 0; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #8b97a7;
    background: linear-gradient(160deg, #1f2937, #111827);
  }
  .ph svg { width: 88px; height: 88px; }

  .info {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 64px 16px 20px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0));
  }
  .info h2 { margin: 0; font-size: 1.25rem; line-height: 1.25; }
  .excerpt {
    margin: 0;
    color: rgba(255, 255, 255, 0.88);
    font-size: 0.95rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 0.75rem;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.45);
  }
  .chip.category { background: rgba(58, 166, 198, 0.4); border-color: transparent; }
  .meta { font-size: 0.8rem; color: rgba(255, 255, 255, 0.72); }

  .msg {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #98a2b3;
    scroll-snap-align: start;
  }

  /* ---------- up / down controls ---------- */
  #controls {
    flex: 0 0 auto;
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .nav {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    padding: 0;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
  }
  .nav:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav svg { width: 22px; height: 22px; }
  #counter { font-weight: 600; font-size: 0.95rem; }
  #pageInfo { font-size: 0.75rem; color: var(--muted); text-align: center; }

  @media (max-width: 560px) {
    main { padding: 8px; }
    .phone { flex: 1 1 auto; border-radius: 12px; }
    #controls {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
    }
    .nav { background: rgba(0, 0, 0, 0.55); color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    #counter, #pageInfo { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
    .info { padding-right: 76px; }
  }

  /* ---------- sign-in page ---------- */
  .login {
    align-self: center;
    width: min(100%, 380px);
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .login h2 { margin: 0 0 6px; font-size: 1.3rem; }
  .login-note { margin: 0 0 16px; color: var(--muted); font-size: 0.88rem; }
  #loginForm { flex-direction: column; gap: 6px; max-width: none; margin: 0; }
  #loginForm label { margin-top: 6px; font-size: 0.85rem; color: var(--muted); }
  #loginForm input { flex: none; }
  #loginForm button { margin-top: 4px; }
  .login-error { min-height: 1.3em; margin: 6px 0 0; color: var(--error-text); font-size: 0.9rem; }
  #session {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---------- tag filter bar + clickable tags ---------- */
  #tagBar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }
  #tagBar strong { color: var(--accent); }
  .link-btn {
    font: inherit;
    font-size: 0.85rem;
    padding: 4px 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .link-btn:hover { background: var(--bg); }
  button.chip {
    font: inherit;
    font-size: 0.75rem;
    color: #fff;
    background: transparent;
    cursor: pointer;
  }
  button.chip:hover { background: rgba(255, 255, 255, 0.22); }
  button.r-chip {
    font: inherit;
    font-size: 0.78rem;
    background: transparent;
    cursor: pointer;
  }
  button.r-chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- full post reader ---------- */
  .slide { cursor: pointer; }
  .slide:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  #reader {
    position: fixed;
    inset: 0;
    z-index: 20;
    overflow-y: auto;
    background: var(--bg);
    color: var(--text);
  }
  .r-bar {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .r-close {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    padding: 7px 14px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .r-close:hover { background: var(--bg); }
  .r-close svg { width: 16px; height: 16px; }
  .r-article { max-width: 760px; margin: 0 auto; padding: 24px 18px 64px; }
  .r-hero {
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    background: #0d1117;
  }
  .r-hero img { display: block; width: 100%; max-height: 60vh; object-fit: contain; }
  .r-hero .ph { height: 220px; }
  .r-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .r-chip {
    font-size: 0.78rem;
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .r-chip.category { border-color: var(--accent); color: var(--accent); }
  .r-article h1 { margin: 0 0 8px; font-size: 1.9rem; line-height: 1.25; }
  .r-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .r-author {
    font: inherit;
    padding: 0;
    color: var(--accent);
    background: none;
    border: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .r-author:hover { color: var(--accent-dark); }
  .r-content {
    font-size: 1.05rem;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .r-tags { margin-top: 28px; }
</style>
</head>
<body>

<header>
  <form id="form">
    <input type="text" id="url" aria-label="Backend base URL" list="recentBases"
           value="http://localhost:8080"
           placeholder="Backend base URL, e.g. http://localhost:8080" autocomplete="off" spellcheck="false">
    <datalist id="recentBases"></datalist>
    <button type="submit" class="load">Load posts</button>
  </form>
  <div class="auth">
    <input type="text" id="account" aria-label="Account name" placeholder="Your account name (added to every request)" autocomplete="off" spellcheck="false">
    <div id="session" hidden>
      <span id="sessionLabel"></span>
      <button type="button" class="link-btn" id="signOut">Sign out</button>
    </div>
  </div>
</header>

<div id="tagBar" hidden>
  <span id="tagLabel"></span>
  <button type="button" class="link-btn" id="tagClear">Back to all posts</button>
</div>

<div id="error" hidden></div>

<main>
  <section id="login" class="login" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Sign in</h2>
    <p class="login-note">Your details are kept only in this page's memory and sent with each request. Refreshing or closing the page signs you out.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="email" spellcheck="false">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
      <div id="loginError" class="login-error" role="alert"></div>
      <button type="submit" class="load">Sign in</button>
    </form>
  </section>

  <div class="phone" id="phone" hidden><div id="feed"></div></div>

  <div id="controls" hidden>
    <button type="button" class="nav" id="up" aria-label="Previous post" title="Previous (Up arrow)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>
    </button>
    <div id="counter">0 / 0</div>
    <button type="button" class="nav" id="down" aria-label="Next post" title="Next (Down arrow)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
    </button>
    <div id="pageInfo"></div>
  </div>
</main>

<div id="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle" hidden>
  <div class="r-bar">
    <button type="button" class="r-close" id="readerClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      Back to feed
    </button>
  </div>
  <article class="r-article" id="readerBody"></article>
</div>

<script>
  const form = document.getElementById("form");
  const urlInput = document.getElementById("url");
  const loginBox = document.getElementById("login");
  const loginForm = document.getElementById("loginForm");
  const loginEmail = document.getElementById("loginEmail");
  const loginPass = document.getElementById("loginPass");
  const loginError = document.getElementById("loginError");
  const phoneBox = document.getElementById("phone");
  const controlsBox = document.getElementById("controls");
  const sessionBox = document.getElementById("session");
  const sessionLabel = document.getElementById("sessionLabel");
  const signOutBtn = document.getElementById("signOut");
  let credentials = null;     // { email, password }, kept only in memory: gone on refresh or sign out
  const errorBox = document.getElementById("error");
  const feed = document.getElementById("feed");
  const upBtn = document.getElementById("up");
  const downBtn = document.getElementById("down");
  const counter = document.getElementById("counter");
  const pageInfo = document.getElementById("pageInfo");
  const reader = document.getElementById("reader");
  const readerBody = document.getElementById("readerBody");
  const readerClose = document.getElementById("readerClose");
  const accountInput = document.getElementById("account");
  const recentBases = document.getElementById("recentBases");
  const tagBar = document.getElementById("tagBar");
  const tagLabel = document.getElementById("tagLabel");
  const tagClear = document.getElementById("tagClear");

  // Every request is  <base URL field> + API_BASE_PATH + one of:
  //   /post?accountName=<account>            main feed
  //   /<tag>/posts?accountName=<account>     posts under a tag
  //   /<account>/post                        posts of one account
  const API_BASE_PATH = "/api/jamboSwift";
  const source = { tag: null, author: null };   // both null = all posts; otherwise a tag or an account being browsed

  let slideCount = 0;     // posts rendered so far
  let current = 0;        // index of the post on screen
  let pageNumber = 0;     // last page loaded
  let more = false;           // is there another page to load?
  let totalElements = null;   // only known when the backend returns a Page (a Slice has no total)
  let loading = false;
  const PRELOAD_AHEAD = 3;    // start loading the next page when this many posts (or fewer) are left to scroll
  let feedId = 0;             // changes whenever a new feed starts, so late answers for an old feed are thrown away
  let prefetched = null;      // { id, page, promise }: the next page, already requested in the background

  /* ---------- helpers ---------- */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function buildHeaders() {
    const headers = { "Accept": "application/json" };
    if (credentials) {          // HTTP Basic: email as the username
      const bytes = new TextEncoder().encode(credentials.email + ":" + credentials.password);
      headers["Authorization"] = "Basic " + btoa(String.fromCharCode(...bytes));
    }
    return headers;
  }

  function normalizeBase(raw) {
    let v = raw.trim();
    if (!v) throw new Error("empty");
    if (!/^https?:\/\//i.test(v)) {   // no protocol typed: local addresses get http, anything else https
      v = (/^(localhost|127\.|192\.168\.|10\.)/i.test(v) ? "http://" : "https://") + v;
    }
    const u = new URL(v);               // throws if it is not a valid URL
    let path = u.pathname.replace(/\/+$/, "");
    const i = path.toLowerCase().indexOf(API_BASE_PATH.toLowerCase());
    if (i !== -1) path = path.slice(0, i);   // a full API address was pasted: keep only what comes before /api/jamboSwift
    return u.origin + path;             // query string and #hash are dropped on purpose
  }

  function getBase() {
    const base = normalizeBase(urlInput.value);
    if (urlInput.value !== base) urlInput.value = base;   // show the cleaned address in the field
    return base;
  }

  function buildUrl(page) {
    const base = getBase() + API_BASE_PATH;
    const account = accountInput.value.trim();
    let url;
    if (source.author) {
      url = new URL(base + "/" + encodeURIComponent(source.author) + "/post");
    } else if (source.tag) {
      url = new URL(base + "/" + encodeURIComponent(source.tag) + "/posts");
      url.searchParams.set("accountName", account);
    } else {
      url = new URL(base + "/post");
      if (account) url.searchParams.set("accountName", account);
    }
    if (page > 0) url.searchParams.set("page", page);
    return url.toString();
  }

  function formatDate(value) {
    const d = new Date(value);
    return isNaN(d) ? "" : d.toLocaleString();
  }

  /* ---------- rendering ---------- */
  function makePlaceholder() {
    const box = el("div", "ph");
    box.innerHTML =
      '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="8" y="12" width="48" height="40" rx="5"/><circle cx="23" cy="26" r="5"/>' +
      '<path d="M10 48l16-14 11 9 8-7 9 10"/></svg><span>No image</span>';
    return box;
  }

  function renderSlide(post) {
    const slide = el("section", "slide");
    slide.setAttribute("aria-label", "Open post: " + (post.title || "untitled"));
    slide.tabIndex = 0;
    slide.addEventListener("click", () => openReader(post));
    slide.addEventListener("keydown", e => { if (e.target === slide && e.key === "Enter") openReader(post); });

    const media = el("div", "media");
    if (post.imageUrl) {
      const img = el("img");
      img.alt = post.title || "Post image";
      img.loading = "eager";      // the feed scrolls one post at a time, so lazy loading only causes a blank flash
      img.decoding = "async";
      img.src = post.imageUrl;
      img.onerror = () => media.replaceChildren(makePlaceholder());  // broken link -> placeholder
      media.appendChild(img);
    } else {
      media.appendChild(makePlaceholder());
    }
    slide.appendChild(media);

    const info = el("div", "info");
    info.appendChild(el("h2", "", post.title || "(untitled)"));

    const cats = post.categoryName || [];
    if (cats.length) {
      const row = el("div", "chips");
      cats.forEach(c => row.appendChild(el("span", "chip category", c)));
      info.appendChild(row);
    }
    if (post.excerpt) info.appendChild(el("p", "excerpt", post.excerpt));

    const tags = post.tags || [];
    if (tags.length) {
      const row = el("div", "chips");
      tags.forEach(t => row.appendChild(tagButton("chip", t)));
      info.appendChild(row);
    }

    const meta = [post.authorName, formatDate(post.createdAt)].filter(Boolean).join(" on ");
    if (meta) info.appendChild(el("div", "meta", meta));

    slide.appendChild(info);
    return slide;
  }

  /* ---------- remembered backend addresses ---------- */
  function renderBases() {
    try {
      const raw = JSON.parse(localStorage.getItem("postsTester.bases") || "[]");
      const list = [...new Set(raw.map(b => { try { return normalizeBase(b); } catch (e) { return null; } }).filter(Boolean))];
      recentBases.replaceChildren(...list.map(b => {
        const o = document.createElement("option");
        o.value = b;
        return o;
      }));
    } catch (e) {}
  }

  function rememberBase() {
    try {
      const base = getBase();
      localStorage.setItem("postsTester.base", base);
      const list = JSON.parse(localStorage.getItem("postsTester.bases") || "[]").filter(b => b !== base);
      list.unshift(base);
      localStorage.setItem("postsTester.bases", JSON.stringify(list.slice(0, 5)));
    } catch (e) {}
    renderBases();
  }

  /* ---------- tags ---------- */
  function tagButton(className, tag) {
    const b = el("button", className, "#" + tag);
    b.type = "button";
    b.title = "Show posts tagged #" + tag;
    b.addEventListener("click", e => { e.stopPropagation(); openTag(tag); });
    return b;
  }

  function updateTagBar() {
    tagBar.hidden = !source.tag && !source.author;
    tagLabel.replaceChildren();
    if (source.author) {
      tagLabel.append("Posts by ");
      tagLabel.appendChild(el("strong", "", source.author));
    } else if (source.tag) {
      tagLabel.append("Posts tagged ");
      tagLabel.appendChild(el("strong", "", "#" + source.tag));
    }
  }

  function openTag(tag) {
    if (!accountInput.value.trim()) {
      if (!reader.hidden) closeReader();
      showError("Enter your account name in the field at the top, then press the tag again.");
      accountInput.focus();
      return;
    }
    if (!reader.hidden) closeReader();
    source.tag = tag;
    source.author = null;
    updateTagBar();
    loadFirst();
  }

  function openAuthor(author) {
    if (!reader.hidden) closeReader();
    source.author = author;
    source.tag = null;
    updateTagBar();
    loadFirst();
  }

  /* ---------- full post view ---------- */
  let lastFocus = null;

  function openReader(post) {
    lastFocus = document.activeElement;
    const parts = [];

    const hero = el("div", "r-hero");
    if (post.imageUrl) {
      const img = el("img");
      img.alt = post.title || "Post image";
      img.src = post.imageUrl;
      img.onerror = () => hero.replaceChildren(makePlaceholder());
      hero.appendChild(img);
    } else {
      hero.appendChild(makePlaceholder());
    }
    parts.push(hero);

    const cats = post.categoryName || [];
    if (cats.length) {
      const row = el("div", "r-chips");
      cats.forEach(c => row.appendChild(el("span", "r-chip category", c)));
      parts.push(row);
    }

    const title = el("h1", "", post.title || "(untitled)");
    title.id = "readerTitle";
    parts.push(title);

    const metaRow = el("div", "r-meta");
    if (post.authorName) {
      const a = el("button", "r-author", post.authorName);
      a.type = "button";
      a.title = "Show posts by " + post.authorName;
      a.addEventListener("click", () => openAuthor(post.authorName));
      metaRow.appendChild(a);
    }
    const when = formatDate(post.createdAt);
    if (when) metaRow.append((post.authorName ? " on " : "") + when);
    if (metaRow.childNodes.length) parts.push(metaRow);

    const content = post.content === null || post.content === undefined || post.content === ""
      ? "(This post has no content.)"
      : String(post.content);
    parts.push(el("div", "r-content", content));   // textContent, so HTML in a post can't run

    const tags = post.tags || [];
    if (tags.length) {
      const row = el("div", "r-chips r-tags");
      tags.forEach(t => row.appendChild(tagButton("r-chip", t)));
      parts.push(row);
    }

    readerBody.replaceChildren(...parts);
    reader.hidden = false;
    reader.scrollTop = 0;
    document.body.style.overflow = "hidden";
    readerClose.focus();
  }

  function closeReader() {
    reader.hidden = true;
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  readerClose.addEventListener("click", closeReader);

  function showMessage(text) {
    feed.replaceChildren(el("div", "msg", text));
    slideCount = 0;
    current = 0;
    updateControls();
  }

  /* ---------- up / down state ---------- */
  function hasMore() { return more; }

  function updateControls() {
    const total = totalElements !== null
      ? Math.max(totalElements, slideCount)
      : slideCount + (more ? "+" : "");
    counter.textContent = slideCount ? (current + 1) + " / " + total : "0 / 0";
    pageInfo.textContent = slideCount
      ? "page " + (pageNumber + 1) + (more ? "" : " (last)")
      : "";
    upBtn.disabled = !slideCount || current <= 0;
    downBtn.disabled = !slideCount || (current >= slideCount - 1 && !hasMore());
  }

  function indexFromScroll() {
    const h = feed.clientHeight;
    return h ? Math.round(feed.scrollTop / h) : 0;
  }

  function go(delta) {
    if (!slideCount) return;
    const base = indexFromScroll();
    const target = Math.min(Math.max(base + delta, 0), slideCount - 1);
    feed.scrollTo({ top: target * feed.clientHeight, behavior: "smooth" });
    if (delta > 0 && nearEnd(base)) loadMore();
  }

  /* ---------- loading ---------- */
  async function fetchPage(page) {
    const target = buildUrl(page);
    let res;
    try {
      res = await fetch(target, { headers: buildHeaders() });
    } catch (err) {
      throw new Error(
        "Could not reach " + target + "\n" +
        "Check that the backend is running and that CORS allows this page's origin."
      );
    }
    if (!res.ok) {
      let msg = "Server responded with " + res.status + " " + res.statusText;
      if (res.status === 400) {
        msg += "\nIf the backend expects accountName, enter your account name in the field at the top.";
      }
      if (res.status === 403) {
        msg += "\nYou are signed in, but this account is not allowed to use this endpoint.";
      }
      const err = new Error(msg);
      err.status = res.status;   // lets callers tell a wrong login (401) from other failures
      throw err;
    }
    const data = await res.json();
    const posts = Array.isArray(data) ? data : (data.content || []);   // Spring Page or plain array
    const info = data.page || {};
    let more;
    if (typeof data.last === "boolean") more = !data.last;              // Slice / classic Page
    else if (typeof data.hasNext === "boolean") more = data.hasNext;    // custom DTO
    else if (info.totalPages !== undefined) more = page + 1 < info.totalPages;   // PagedModel
    else more = posts.length > 0;                                       // no metadata: keep going until an empty page
    const total = info.totalElements ?? data.totalElements ?? null;
    return { posts, number: page, more, total };
  }

  /* ---------- sign in / sign out ---------- */
  function setLoggedIn(on) {
    loginBox.hidden = on;
    phoneBox.hidden = !on;
    controlsBox.hidden = !on;
    sessionBox.hidden = !on;
    sessionLabel.textContent = on && credentials ? "Signed in as " + credentials.email : "";
  }

  function showLogin(message) {
    setLoggedIn(false);
    loginError.textContent = message || "";
    loginPass.value = "";
    (loginEmail.value ? loginPass : loginEmail).focus();
  }

  // Forget the credentials, drop anything still loading, and go back to the sign-in page
  function requireLogin(message) {
    credentials = null;
    feedId++;
    prefetched = null;
    loading = false;
    source.tag = null;
    source.author = null;
    updateTagBar();
    errorBox.hidden = true;
    if (!reader.hidden) closeReader();
    feed.replaceChildren();
    slideCount = 0; current = 0; more = false; totalElements = null; pageNumber = 0;
    updateControls();
    showLogin(message);
  }

  function nearEnd(index) {
    return slideCount - 1 - index <= PRELOAD_AHEAD;
  }

  // Ask for the next page in the background, so it is ready before the user gets there.
  function startPrefetch() {
    if (!more) { prefetched = null; return; }
    const id = feedId;
    const page = pageNumber + 1;
    if (prefetched && prefetched.id === id && prefetched.page === page) return;
    const promise = fetchPage(page);
    promise.catch(() => {});      // a failure is reported later, when the page is actually needed
    prefetched = { id, page, promise };
  }

  async function loadFirst() {
    errorBox.hidden = true;
    if (!credentials) { showLogin(); return; }
    try { getBase(); }
    catch (e) {
      showError("Enter the backend base URL, for example http://localhost:8080 or https://your-backend.example.com");
      return;
    }
    const id = ++feedId;          // this is now the newest feed; anything still loading for an older one is ignored
    prefetched = null;
    loading = true;
    showMessage("Loading...");
    let loaded = false;
    try {
      const r = await fetchPage(0);
      if (id !== feedId) return;
      rememberBase();   // only keep addresses that actually worked
      pageNumber = r.number;
      more = r.more;
      totalElements = r.total;
      if (!r.posts.length) {
        showMessage(source.author ? "No posts found for " + source.author + "." : source.tag ? "No posts found for #" + source.tag + "." : "The request worked, but there are no posts to show.");
        return;
      }
      feed.replaceChildren(...r.posts.map(renderSlide));
      slideCount = r.posts.length;
      current = 0;
      feed.scrollTop = 0;
      updateControls();
      startPrefetch();
      loaded = true;
    } catch (err) {
      if (id !== feedId) return;
      if (err.status === 401) { requireLogin("Wrong email or password. Please sign in again."); return; }
      more = false; totalElements = null; pageNumber = 0;
      showMessage("Nothing loaded.");
      showError(err.message);
    } finally {
      if (id === feedId) loading = false;
    }
    if (loaded && nearEnd(0)) loadMore();   // very small pages: the next one is needed straight away
  }

  async function loadMore() {
    if (loading || !more || !credentials) return;
    loading = true;
    const id = feedId;
    const page = pageNumber + 1;
    let appended = false;
    try {
      const job = prefetched && prefetched.id === id && prefetched.page === page
        ? prefetched.promise          // already on its way (or here) from the background request
        : fetchPage(page);
      prefetched = null;
      const r = await job;
      if (id !== feedId) return;
      pageNumber = r.number;
      more = r.more;
      totalElements = r.total;
      r.posts.forEach(p => feed.appendChild(renderSlide(p)));
      slideCount += r.posts.length;
      appended = r.posts.length > 0;
      updateControls();
      startPrefetch();                // line up the page after this one
    } catch (err) {
      if (id === feedId) {
        if (err.status === 401) requireLogin("Wrong email or password. Please sign in again.");
        else showError(err.message);
      }
    } finally {
      if (id === feedId) loading = false;
    }
    if (appended && id === feedId && nearEnd(current)) loadMore();
  }

  /* ---------- events ---------- */
  form.addEventListener("submit", e => {
    e.preventDefault();
    source.tag = null;          // Load posts always goes back to the full feed
    source.author = null;
    updateTagBar();
    loadFirst();
  });
  loginForm.addEventListener("submit", e => {
    e.preventDefault();
    const email = loginEmail.value.trim();
    const password = loginPass.value;
    if (!email || !password) { loginError.textContent = "Enter your email and password."; return; }
    try { getBase(); }
    catch (err) { loginError.textContent = "Enter the backend address in the field at the top first."; return; }
    credentials = { email, password };
    loginPass.value = "";
    loginError.textContent = "";
    source.tag = null;
    source.author = null;
    updateTagBar();
    setLoggedIn(true);
    loadFirst();                  // a wrong email or password comes back as a 401 and returns to this page
  });
  signOutBtn.addEventListener("click", () => requireLogin(""));
  tagClear.addEventListener("click", () => { source.tag = null; source.author = null; updateTagBar(); loadFirst(); });

  // remember the account name between visits (wrapped in try/catch: storage can be unavailable)
  try { accountInput.value = localStorage.getItem("postsTester.account") || ""; } catch (e) {}
  accountInput.addEventListener("input", () => {
    try { localStorage.setItem("postsTester.account", accountInput.value.trim()); } catch (e) {}
  });

  // base URL: the last one that worked, else the address this page is served from, else localhost
  if (location.protocol.startsWith("http")) urlInput.value = location.origin;
  try { urlInput.value = localStorage.getItem("postsTester.base") || urlInput.value; } catch (e) {}
  try { getBase(); } catch (e) {}   // tidies a saved or pasted full URL down to the base address
  renderBases();
  upBtn.addEventListener("click", () => go(-1));
  downBtn.addEventListener("click", () => go(1));

  let ticking = false;
  feed.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (!slideCount) return;
      current = indexFromScroll();
      updateControls();
      if (nearEnd(current)) loadMore();   // load the next page when only a few posts are left
    });
  });

  document.addEventListener("keydown", e => {
    if (!reader.hidden) {                 // reader open: Esc closes it, feed keys are ignored
      if (e.key === "Escape") closeReader();
      return;
    }
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); go(1); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); go(-1); }
  });

  window.addEventListener("resize", () => {
    feed.scrollTo({ top: current * feed.clientHeight });   // keep the current post snapped
  });

  showLogin();
</script>
</body>
</html>
