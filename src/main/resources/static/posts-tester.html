<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posts tester</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1c2430;
    --muted: #667085;
    --line: #dde1e8;
    --accent: #0f6e8c;
    --accent-dark: #0b566e;
    --error-bg: #fdecec;
    --error-text: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --surface: #1b222b;
      --text: #e6eaf0;
      --muted: #98a2b3;
      --line: #2c3541;
      --accent: #3aa6c6;
      --accent-dark: #5bbad7;
      --error-bg: #3a1d1d;
      --error-text: #f4b4b4;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }
  form {
    display: flex;
    gap: 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  input, select {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .auth { display: flex; gap: 8px; max-width: 1100px; margin: 8px auto 0; }
  .auth select { flex: 0 0 auto; }
  button {
    font: inherit;
    padding: 10px 18px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary {
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
  }
  button.secondary:hover:not(:disabled) { background: var(--bg); }

  main { max-width: 1100px; margin: 0 auto; padding: 20px; }

  #status {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    color: var(--muted);
    font-size: 0.92rem;
  }
  #pager { display: flex; gap: 8px; }
  #pager button { padding: 6px 12px; }

  #error {
    background: var(--error-bg);
    color: var(--error-text);
    padding: 12px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  article {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  article img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--line);
  }
  .body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  h2 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
  .excerpt { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .meta { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .chip.category { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
</style>
</head>
<body>

<header>
  <form id="form">
    <input type="text" id="url" aria-label="Posts URL"
           value="http://localhost:8080/post"
           placeholder="http://localhost:8080/post" autocomplete="off" spellcheck="false">
    <button type="submit">Load posts</button>
  </form>
  <div class="auth">
    <select id="authMode" aria-label="Authentication">
      <option value="none">No auth</option>
      <option value="basic">Basic auth</option>
      <option value="bearer">Bearer token (JWT)</option>
    </select>
    <input type="text" id="authUser" placeholder="Username" autocomplete="off" hidden>
    <input type="password" id="authPass" placeholder="Password" autocomplete="off" hidden>
    <input type="text" id="authToken" placeholder="Paste token" autocomplete="off" spellcheck="false" hidden>
  </div>
</header>

<main>
  <div id="error" hidden></div>
  <div id="status" hidden>
    <span id="summary"></span>
    <div id="pager">
      <button type="button" class="secondary" id="prev">Previous</button>
      <button type="button" class="secondary" id="next">Next</button>
    </div>
  </div>
  <div id="grid"></div>
  <p class="empty" id="hint">Enter your posts URL above and press Load posts.</p>
</main>

<script>
  // Inline SVG placeholder shown when imageUrl is null or fails to load
  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">' +
    '<rect width="640" height="360" fill="#e3e7ed"/>' +
    '<g fill="none" stroke="#9aa5b4" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">' +
    '<rect x="240" y="120" width="160" height="120" rx="10"/>' +
    '<circle cx="283" cy="161" r="14"/>' +
    '<path d="M246 232 l52 -48 l36 32 l24 -20 l36 36"/></g>' +
    '<text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#7d8896">No image</text>' +
    '</svg>'
  );

  const form = document.getElementById("form");
  const urlInput = document.getElementById("url");
  const grid = document.getElementById("grid");
  const errorBox = document.getElementById("error");
  const statusBar = document.getElementById("status");
  const summary = document.getElementById("summary");
  const hint = document.getElementById("hint");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");

  const authMode = document.getElementById("authMode");
  const authUser = document.getElementById("authUser");
  const authPass = document.getElementById("authPass");
  const authToken = document.getElementById("authToken");

  function updateAuthFields() {
    authUser.hidden = authPass.hidden = authMode.value !== "basic";
    authToken.hidden = authMode.value !== "bearer";
  }
  authMode.addEventListener("change", updateAuthFields);

  function buildHeaders() {
    const headers = { "Accept": "application/json" };
    if (authMode.value === "basic") {
      const bytes = new TextEncoder().encode(authUser.value + ":" + authPass.value);
      headers["Authorization"] = "Basic " + btoa(String.fromCharCode(...bytes));
    } else if (authMode.value === "bearer") {
      headers["Authorization"] = "Bearer " + authToken.value.trim();
    }
    return headers;
  }

  let pageNumber = 0;
  let totalPages = 0;

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function buildUrl(page) {
    const url = new URL(urlInput.value.trim());
    if (page > 0) url.searchParams.set("page", page);
    else url.searchParams.delete("page");
    return url.toString();
  }

  function formatDate(value) {
    const d = new Date(value);
    return isNaN(d) ? "" : d.toLocaleString();
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderPost(post) {
    const card = el("article");

    const img = el("img");
    img.alt = post.title || "Post image";
    img.loading = "lazy";
    img.src = post.imageUrl ? post.imageUrl : PLACEHOLDER;
    img.onerror = () => {            // broken link falls back to the placeholder too
      img.onerror = null;
      img.src = PLACEHOLDER;
    };
    card.appendChild(img);

    const body = el("div", "body");
    body.appendChild(el("h2", "", post.title || "(untitled)"));

    const cats = (post.categoryName || []);
    if (cats.length) {
      const row = el("div", "chips");
      cats.forEach(c => row.appendChild(el("span", "chip category", c)));
      body.appendChild(row);
    }

    if (post.excerpt) body.appendChild(el("p", "excerpt", post.excerpt));

    const tags = (post.tags || []);
    if (tags.length) {
      const row = el("div", "chips");
      tags.forEach(t => row.appendChild(el("span", "chip", "#" + t)));
      body.appendChild(row);
    }

    const meta = [post.authorName, formatDate(post.createdAt)].filter(Boolean).join(" on ");
    body.appendChild(el("div", "meta", meta));

    card.appendChild(body);
    return card;
  }

  async function load(page) {
    errorBox.hidden = true;
    let target;
    try {
      target = buildUrl(page);
    } catch (e) {
      showError("That is not a valid URL. Include the protocol, for example http://localhost:8080/post");
      return;
    }

    summary.textContent = "Loading...";
    statusBar.hidden = false;

    try {
      const res = await fetch(target, { headers: buildHeaders() });
      if (!res.ok) {
        let msg = "Server responded with " + res.status + " " + res.statusText;
        if (res.status === 401 || res.status === 403) {
          msg += "\nThis endpoint needs authentication. Pick Basic auth or Bearer token above and enter your credentials.";
        }
        throw new Error(msg);
      }
      const data = await res.json();

      // Supports Spring's Page-style response ({content, page}) and a plain array
      const posts = Array.isArray(data) ? data : (data.content || []);
      const info = data.page || {};
      pageNumber = info.number ?? 0;
      totalPages = info.totalPages ?? 1;

      grid.replaceChildren(...posts.map(renderPost));
      hint.hidden = posts.length > 0 ? true : false;
      hint.textContent = "The request worked, but there are no posts to show.";

      const total = info.totalElements ?? posts.length;
      summary.textContent =
        "Showing " + posts.length + " of " + total + " posts. Page " +
        (pageNumber + 1) + " of " + Math.max(totalPages, 1) + ".";
      prevBtn.disabled = pageNumber <= 0;
      nextBtn.disabled = pageNumber >= totalPages - 1;
    } catch (err) {
      grid.replaceChildren();
      statusBar.hidden = true;
      hint.hidden = true;
      if (err instanceof TypeError) {
        showError(
          "Could not reach " + target + "\n" +
          "Check that the backend is running and that CORS allows this page's origin " +
          "(opening this file directly sends the origin \"null\")."
        );
      } else {
        showError(err.message);
      }
    }
  }

  form.addEventListener("submit", e => { e.preventDefault(); load(0); });
  prevBtn.addEventListener("click", () => load(pageNumber - 1));
  nextBtn.addEventListener("click", () => load(pageNumber + 1));
</script>
</body>
</html>
